# Pinned so container and volume names do not change if the folder is renamed.
name: scale-dotorg

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: booths
      POSTGRES_PASSWORD: booths
      POSTGRES_DB: booths
    ports: ['5433:5432']
    volumes: ['booths-db:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U booths']
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    ports: ['1025:1025', '8025:8025']

volumes:
  booths-db:
