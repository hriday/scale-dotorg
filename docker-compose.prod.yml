# Production stack. Bring up with:
#   docker compose --env-file .env.production -f docker-compose.prod.yml up -d --build
name: scale-dotorg

services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env.production
    # Bound to loopback: the reverse proxy is the only thing that should reach it.
    ports: ['127.0.0.1:3000:3000']
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: booths
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?pass --env-file .env.production}
      POSTGRES_DB: booths
    volumes:
      - booths-db:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U booths']
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  booths-db:
