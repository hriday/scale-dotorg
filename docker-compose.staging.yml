# The deployed stack while mail is still local.
#
# CADDYFILE selects which TLS config Caddy mounts:
#   ./Caddyfile.staging  bare IP, Caddy's local CA (before DNS)
#   ./Caddyfile          real hostname, Let's Encrypt (after DNS)
#
# The remaining difference from production is mail: it goes to a local Mailpit
# rather than SMTP2GO, until the API key and sender verification exist.
#
# Mailpit is bound to loopback deliberately. Anyone who can read the inbox can
# read an admin sign-in link, which is the whole authentication system. Reach it
# with:  ssh -L 8025:localhost:8025 root@<host>  then http://localhost:8025
#
#   docker compose --env-file .env.production -f docker-compose.staging.yml up -d --build

name: scale-dotorg

services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env.production
    # Loopback only: Caddy is the only thing that should reach the app.
    ports: ['127.0.0.1:3000:3000']
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: booths
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?pass --env-file .env.production}
      POSTGRES_DB: booths
    volumes:
      - booths-db:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U booths']
      interval: 10s
      timeout: 5s
      retries: 10

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ['80:80', '443:443']
    volumes:
      - ${CADDYFILE:-./Caddyfile.staging}:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [app]

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    # Loopback only: the inbox holds admin sign-in links.
    ports: ['127.0.0.1:8025:8025']

volumes:
  booths-db:
  caddy-data:
  caddy-config:
